[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-content-search"
version = "1.2.0.dev0"
description = "macOS 本地内容混合检索系统"
requires-python = ">=3.11,<3.13"
dependencies = [
  "lancedb==0.40.0",
  "pydantic>=2.7.4,<3",
  "sentence-transformers==6.1.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "timm==1.0.30",
  "transformers==5.20.2",
  "sentencepiece==0.2.2",
  "pymupdf==2.0",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "ocrmac==1.0.1",
  "pillow==13.0.0",
  "charset-normalizer==3.5.2",
  "fastapi==0.156.4",
  "uvicorn[standard]==0.54.0",
  "python-multipart",
  "huggingface-hub>=1.33.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: 需要加载真实模型的测试",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
